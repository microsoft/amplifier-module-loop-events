name: Component tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    name: Core 2.0.2 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      # These opt-in source fixtures are not installed integration evidence.
      AMPLIFIER_MEDIA_F1_TEST_ROOT: ""
      AMPLIFIER_MEDIA_BRIDGE_TEST_FILE: ""
      AMPLIFIER_MEDIA_BRIDGE_PROFILE: ""
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install declared dev group with exact component test versions
        run: |
          mkdir -p test-results
          uv venv --python python .venv
          # Do not rewrite the repository lock or runtime dependency model.
          # This explicit Core profile supersedes the lock's older Core 1.3.0.
          set -o pipefail
          uv pip install --python .venv/bin/python --group dev \
            "amplifier-core==2.0.2" "pytest==9.0.3" "pytest-asyncio==1.3.0" \
            -e . 2>&1 | tee test-results/install.log
      - name: Run maintained component tests and record provenance
        run: .venv/bin/python .github/scripts/component_tests.py
      - name: Retain logs, collection, JUnit and dependency versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-python-${{ matrix.python }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14